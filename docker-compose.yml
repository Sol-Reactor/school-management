# Local development database for Haya.
# Usage: docker compose up -d   (Postgres on localhost:5433)
services:
  db:
    image: postgres:16-alpine
    container_name: haya-postgres
    environment:
      POSTGRES_USER: haya
      POSTGRES_PASSWORD: haya_local_dev
      POSTGRES_DB: haya
    ports:
      - "5433:5432"
    volumes:
      - haya-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haya -d haya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  haya-pgdata:
