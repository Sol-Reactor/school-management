<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Haya — School management for admins, teachers, students and parents</title>
    <meta
      name="description"
      content="Haya brings attendance, grades, timetables and AI-assisted progress insights into one calm workspace for schools — with a dedicated view for every admin, teacher, student and parent."
    />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haya" />
    <meta property="og:title" content="Haya — the calm way to run a school" />
    <meta
      property="og:description"
      content="Attendance, grades, timetables and AI progress summaries in one workspace for admins, teachers, students and parents. Try the live demo."
    />
    <meta property="og:url" content="https://manageschool-fawn.vercel.app/" />
    <meta property="og:image" content="https://manageschool-fawn.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Haya admin dashboard showing attendance trends and KPI cards" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved appearance before first paint (no flash of the wrong theme). -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('haya:prefs') || '{}');
          var theme = p.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          if (p.textSize) root.dataset.textSize = p.textSize;
          if (p.reduceMotion) root.dataset.reduceMotion = 'true';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Haya needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
