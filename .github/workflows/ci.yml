name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haya
          POSTGRES_PASSWORD: haya_ci
          POSTGRES_DB: haya_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U haya -d haya_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://haya:haya_ci@localhost:5432/haya_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: school-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
